---
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: scylladb-connection-secret
  namespace: astarte
data:
  password: Y2Fzc2FuZHJh
  username: Y2Fzc2FuZHJh
---
apiVersion: ingress.astarte-platform.org/v2alpha1
kind: AstarteDefaultIngress
metadata:
  name: adi
  namespace: astarte
spec:
  ### Astarte Default Ingress CRD
  astarte: astarte
  tlsSecret: astarte-tls-cert
  api:
    deploy: true
    exposeHousekeeping: true
  dashboard:
    deploy: true
    host: dashboard.astarte.localhost
  broker:
    deploy: false
---
apiVersion: api.astarte-platform.org/v2alpha1
kind: Astarte
metadata:
  name: astarte
  namespace: astarte
spec:
  version: 1.3.0
  features:
    realmDeletion: true
  api:
    host: api.astarte.localhost
    ssl: true
  components:
    flow:
      antiAffinity: false
    housekeeping:
      antiAffinity: false
    realmManagement:
      antiAffinity: false
    pairing:
      antiAffinity: false
    dataUpdaterPlant:
      antiAffinity: false
    appengineApi:
      antiAffinity: false
    triggerEngine:
      antiAffinity: false
    dashboard:
      antiAffinity: false
  cassandra:
    astarteSystemKeyspace:
      replicationFactor: 1
      replicationStrategy: SimpleStrategy
    connection:
      nodes:
        - host: "scylla-local-kind-1-local-kind-1a-0.scylla-operator.svc.cluster.local"
          port: 9042
      credentialsSecret:
        name: scylladb-connection-secret
        usernameKey: username
        passwordKey: password
  vernemq:
    deploy: true
    replicas: 1
    host: broker.astarte.localhost
    port: 8883
    sslListener: true
    sslListenerCertSecretName: astarte-tls-cert
    additionalEnv:
      - name: DOCKER_VERNEMQ_LOG__CONSOLE
        value: console
      - name: DOCKER_VERNEMQ_LOG__CONSOLE__LEVEL
        value: debug
  rabbitmq:
    connection:
      host: rabbitmq.rabbitmq-system.svc.cluster.local
      port: 5672
      credentialsSecret:
        name: rabbitmq-connection-secret
        usernameKey: username
        passwordKey: password
    managementConnection:
      host: rabbitmq.rabbitmq-system.svc.cluster.local
      port: 15672
