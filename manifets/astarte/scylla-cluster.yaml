# Source: scylla/templates/scyllacluster.yaml
apiVersion: scylla.scylladb.com/v1
kind: ScyllaCluster
metadata:
  name: scylla
  namespace: scylla-operator
spec:
  version: 2025.1.5
  agentVersion: 3.5.1@sha256:d1b57d08b9949c8faad2048fdf4dc7c502dae81da856c3c6b3a77dd347d5c7fc
  repository: scylladb/scylla
  agentRepository: scylladb/scylla-manager-agent
  developerMode: true
  # sysctls:
  #   - fs.aio-max-nr=30000000
  datacenter:
    name: local-kind-1
    racks:
      - members: 1
        name: local-kind-1a
        scyllaConfig: scylladb-config
        resources:
          limits:
            cpu: "500m"
            memory: "1Gi"
          requests:
            cpu: "250m"
            memory: "512Mi"
        storage:
          capacity: 5Gi
          storageClassName: standard
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: scylladb-config
  namespace: scylla-operator
data:
  scylla.yaml: |
    # By default, Scylla do not use authentication and authorization.
    # We want to enable both to avoid setting empty username and password
    # that can cause issues with VerneMQ. The VerneMQ behavior with empty
    # env vars still has to be investigated, for now, we want to have
    # authentication and authorization enabled.
    authenticator: PasswordAuthenticator
    authorizer: CassandraAuthorizer
